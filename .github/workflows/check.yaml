# Full check suite in CI: Python tests, firmware, Verilator lint, Icarus,
# cocotb host-interface and lockstep tests, formal proofs. This is the
# project's own workflow (not from the Tiny Tapeout template) and is the
# broadest signal: lint, formal and the full cocotb suite in one job (the
# template's `test` workflow runs the cocotb suite only; DECISIONS D-027).
name: check
on: [push, workflow_dispatch]
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update && sudo apt-get install -y iverilog verilator yosys z3
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install pytest cocotb yowasp-yosys
      - run: bash scripts/check_all.sh
      - name: test results
        uses: test-summary/action@v2.4
        with:
          paths: "test/results.xml"
        if: always()
