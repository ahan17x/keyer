# Tiny Tapeout project information
project:
  title:        "Keyer protocol emulator"
  author:       "Ahan Shah"
  discord:      ""
  description:  "Two-thread pin-oriented CPU that bit-bangs UART, SPI, I2C and more from firmware loaded over SPI"
  language:     "Verilog"
  clock_hz:     50000000

  # Jane Street protocol emulator competition allocation (IHP CMOS5L).
  tiles: "6x4"

  top_module:  "tt_um_ahan17x_keyer"

  # Source files must be in ./src and listed one per line.
  source_files:
    - "keyer_isa.vh"
    - "keyer_fifo.v"
    - "keyer_imem.v"
    - "keyer_pins.v"
    - "keyer_core.v"
    - "keyer_host.v"
    - "tt_um_ahan17x_keyer.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs
  ui[0]: "SCK (host SPI)"
  ui[1]: "MOSI (host SPI)"
  ui[2]: "CS_n (host SPI)"
  ui[3]: "IN3 (firmware pin 11)"
  ui[4]: "IN4 (firmware pin 12)"
  ui[5]: "IN5 (firmware pin 13)"
  ui[6]: "IN6 (firmware pin 14)"
  ui[7]: "IN7 (firmware pin 15)"

  # Outputs
  uo[0]: "MISO (host SPI)"
  uo[1]: "IRQ"
  uo[2]: "OUT2 (firmware pin 18)"
  uo[3]: "OUT3 (firmware pin 19)"
  uo[4]: "OUT4 (firmware pin 20)"
  uo[5]: "OUT5 (firmware pin 21)"
  uo[6]: "OUT6 (firmware pin 22)"
  uo[7]: "OUT7 (firmware pin 23)"

  # Bidirectional pins
  uio[0]: "IO0 (firmware pin 0)"
  uio[1]: "IO1 (firmware pin 1)"
  uio[2]: "IO2 (firmware pin 2, I2C SCL in the demo firmware)"
  uio[3]: "IO3 (firmware pin 3, I2C SDA in the demo firmware)"
  uio[4]: "IO4 (firmware pin 4)"
  uio[5]: "IO5 (firmware pin 5)"
  uio[6]: "IO6 (firmware pin 6)"
  uio[7]: "IO7 (firmware pin 7)"

# Do not change!
yaml_version: 6
